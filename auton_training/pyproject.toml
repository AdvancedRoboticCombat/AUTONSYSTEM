[project]
name = "dodge-master"
version = "0.1.0"
description = "2D combat-robot simulator and PPO trainer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.7",
    "numpy",
    "scipy",
    "pygame",
]

[tool.uv]
package = false   # flat scripts, nothing to build or install

# CUDA 12.8 wheels (needed for 50-series cards) on Windows and Linux; macOS
# takes the default PyPI wheel, which has MPS.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
